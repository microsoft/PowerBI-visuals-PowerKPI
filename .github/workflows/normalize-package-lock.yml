name: normalize package lock

on:
  pull_request_target:
    branches: [ main, dev ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: write
  pull-requests: write

jobs:
  normalize-package-lock:
    runs-on: ubuntu-22.04

    steps:
    - name: Check out trusted workflow scripts
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: trusted
        persist-credentials: false

    - name: Check out the pull request branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.ref }}
        token: ${{ github.token }}
        path: pull-request
        persist-credentials: false

    - name: Verify and normalize package lock
      run: node trusted/scripts/sanitize-lockfile.mjs --path pull-request/package-lock.json

    - name: Check for package lock changes
      id: package_lock
      shell: bash
      working-directory: pull-request
      run: |
        if git diff --quiet -- package-lock.json; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Comment when package lock is already clean
      if: steps.package_lock.outputs.changed == 'false'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const marker = "<!-- normalize-package-lock -->";
          const body = `${marker}\nThe package lock already uses verified public-registry artifacts; no normalization commit is needed.`;
          const params = {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          };
          const comments = await github.paginate(github.rest.issues.listComments, params);
          const existing = comments.find(comment =>
            comment.user?.type === "Bot" && comment.body?.includes(marker)
          );

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({ ...params, body });
          }

    - name: Commit and push changes
      if: steps.package_lock.outputs.changed == 'true'
      shell: bash
      working-directory: pull-request
      env:
        GITHUB_TOKEN: ${{ github.token }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add package-lock.json
        git commit -m "Normalize package-lock registry URLs"
        git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${HEAD_REPO}.git" "HEAD:${HEAD_REF}"