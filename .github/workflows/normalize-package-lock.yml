name: normalize package lock

# Uses the unprivileged pull_request trigger, so code from a fork never gets a write token
# or secrets. Instead of pushing to the fork, the normalized lock file is uploaded as an
# artifact for the contributor to commit (corporate machines often cannot reach registry.npmjs.org).
on:
  pull_request:
    branches: [ main, dev ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read

jobs:
  normalize-package-lock:
    runs-on: ubuntu-22.04

    steps:
    - name: Check out the pull request
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Verify and normalize package lock
      run: node scripts/sanitize-lockfile.mjs --path package-lock.json

    - name: Check for package lock changes
      id: package_lock
      shell: bash
      run: |
        if git diff --quiet -- package-lock.json; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload normalized package lock
      if: steps.package_lock.outputs.changed == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: normalized-package-lock
        path: package-lock.json
        if-no-files-found: error

    - name: Fail until the normalized package lock is committed
      if: steps.package_lock.outputs.changed == 'true'
      shell: bash
      run: |
        {
          echo "### package-lock.json must be normalized"
          echo ""
          echo "It references a non-public npm registry or sha1 integrity."
          echo "Download the **normalized-package-lock** artifact from this run, replace package-lock.json in your branch with the file it contains, and push."
          echo "The file is built from the PR merge result: if \`main\` changed package-lock.json after you branched, merge \`main\` into your branch first."
        } >> "$GITHUB_STEP_SUMMARY"
        echo "::error file=package-lock.json::package-lock.json references a non-public npm registry or sha1 integrity. Commit the normalized-package-lock artifact from this run."
        exit 1