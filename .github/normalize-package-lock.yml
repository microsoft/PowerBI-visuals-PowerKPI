name: normalize package lock

on:
  pull_request_target:
    branches: [ main, dev ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: write
  pull-requests: write

jobs:
  normalize-package-lock:
    runs-on: ubuntu-22.04

    steps:
    - name: Check out trusted workflow scripts
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: trusted
        persist-credentials: false

    - name: Check out the pull request branch
      uses: actions/checkout@v4
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.ref }}
        token: ${{ github.token }}
        path: pull-request
        persist-credentials: false

    - name: Verify and normalize package lock
      run: node trusted/scripts/sanitize-lockfile.mjs --path pull-request/package-lock.json

    - name: Commit and push changes
      shell: bash
      working-directory: pull-request
      env:
        GITHUB_TOKEN: ${{ github.token }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        if git diff --quiet -- package-lock.json; then
          echo "The package lock already uses verified public-registry artifacts; no commit is needed." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add package-lock.json
        git commit -m "Normalize package-lock registry URLs"
        git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${HEAD_REPO}.git" "HEAD:${HEAD_REF}"
